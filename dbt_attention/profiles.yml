attention:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5435') | as_number }}"
      user: postgres
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: attention
      schema: analytics
      threads: 2
